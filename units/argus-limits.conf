# argus-limits.conf: the resource limits every agent task in an Argus home gets (the same drop-in argus-ui and Hermes
# use): a quarter of one core, 512 MB, low I/O weight, nice 10. scripts/install.sh puts it in
# ~/.config/systemd/user/zeus-queue.service.d/. Deploys get their own limits on the systemd-run line (docs/design.md §4).
[Service]
CPUQuota=25%
MemoryMax=512M
IOWeight=50
Nice=10
